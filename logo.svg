<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1A0310" />
      <stop offset="60%" stop-color="#050506" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Tyrian Purple Core Fill Gradient -->
    <linearGradient id="tyrianCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#540B32" />
      <stop offset="50%" stop-color="#3A0722" />
      <stop offset="100%" stop-color="#1A020E" />
    </linearGradient>

    <!-- Chiseled Gold Gradient -->
    <linearGradient id="chiseledGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#73510A" />
      <stop offset="30%" stop-color="#C59B27" />
      <stop offset="50%" stop-color="#EEDAA2" />
      <stop offset="70%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#4A3304" />
    </linearGradient>

    <!-- Crimson Fracture Flash -->
    <linearGradient id="crimsonFracture" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF1A3B" />
      <stop offset="50%" stop-color="#7A0010" />
      <stop offset="100%" stop-color="#3D0006" />
    </linearGradient>
    
    <!-- Subtle Ambient Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas Background -->
  <rect width="800" height="800" fill="url(#bgGlow)" />

  <g transform="translate(0, -30)" filter="url(#shadow)">
    <!-- THE OUTER SHIELD / SEAL FRAME (Sharp Roman Geometry) -->
    <polygon points="400,120 580,210 580,490 400,600 220,490 220,210" 
             fill="url(#tyrianCore)" 
             stroke="url(#chiseledGold)" 
             stroke-width="8" 
             stroke-linejoin="miter" />

    <!-- Inner Metallic Gold Inset Border -->
    <polygon points="400,145 555,222 555,478 400,575 245,478 245,222" 
             fill="none" 
             stroke="url(#chiseledGold)" 
             stroke-width="2" 
             stroke-opacity="0.6" />

    <!-- MONOGRAM ABSTRACT CORE: THE 'P' AND THE ROMAN 'III' -->
    <!-- The Upper Loop of the "P" -->
    <path d="M 330,220 L 440,220 C 490,220 490,310 440,310 L 330,310 Z" 
          fill="none" 
          stroke="url(#chiseledGold)" 
          stroke-width="14" 
          stroke-linecap="square" 
          stroke-linejoin="miter" />

    <!-- The Three Structural Columns of the Roman III -->
    <!-- Column I (Also acts as the main downstroke of the P) -->
    <line x1="330" y1="220" x2="330" y2="490" stroke="url(#chiseledGold)" stroke-width="14" stroke-linecap="square" />
    <!-- Column II (Middle Core Pillar) -->
    <line x1="400" y1="310" x2="400" y2="490" stroke="url(#chiseledGold)" stroke-width="14" stroke-linecap="square" />
    <!-- Column III (Right Pillar) -->
    <line x1="470" y1="310" x2="470" y2="490" stroke="url(#chiseledGold)" stroke-width="14" stroke-linecap="square" />

    <!-- Traditional Roman Serif Cross-Bars (Base Foundations) -->
    <line x1="310" y1="490" x2="490" y2="490" stroke="url(#chiseledGold)" stroke-width="10" />
    <line x1="380" y1="310" x2="490" y2="310" stroke="url(#chiseledGold)" stroke-width="10" />

    <!-- THE CRIMSON FRACTURE (The Final Inescapable Slash / Execution) -->
    <polygon points="397,100 403,100 401,620 399,620" fill="url(#crimsonFracture)" />
    <!-- Glowing epicenter cross-cut flash -->
    <path d="M 320,380 L 480,360" stroke="#FF1A3B" stroke-width="3" stroke-opacity="0.8" />
  </g>

  <!-- TYPOGRAPHY WORDMARK: PACT3FI -->
  <text x="400" y="690" 
        font-family="'Times New Roman', 'Trajan Pro', 'Georgia', serif" 
        font-size="52" 
        font-weight="bold" 
        letter-spacing="8" 
        text-anchor="middle">
    <tspan fill="url(#chiseledGold)">PACT</tspan>
    <tspan fill="#F2F2F4" font-style="italic">III</tspan>
    <tspan fill="#A30015">FI</tspan>
  </text>

  <!-- Deep Subtitle / Latin Legal Motto: "The terms are absolute" -->
  <text x="400" y="730" 
        font-family="'Courier New', monospace" 
        font-size="14" 
        letter-spacing="4" 
        fill="#787880" 
        text-anchor="middle">
    TERMINI ABSOLUTI SUNT
  </text>
</svg>
