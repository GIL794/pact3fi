<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#091428" />
      <stop offset="60%" stop-color="#040814" />
      <stop offset="100%" stop-color="#020308" />
    </radialGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#00A3FF" />
      <stop offset="100%" stop-color="#0055FF" />
    </linearGradient>

    <!-- Warm Gold Gradient -->
    <linearGradient id="goldGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="40%" stop-color="#FFA800" />
      <stop offset="70%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFF0A0" />
    </linearGradient>

    <!-- Shield Metallic Core -->
    <linearGradient id="shieldCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14213d" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050a17" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00F0FF" flood-opacity="0.35"/>
    </filter>
    
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="800" rx="40" fill="url(#bgGlow)" />

  <g transform="translate(0, -20)" filter="url(#shieldShadow)">
    
    <!-- TENTACLES (Back Layer - Flowing curves) -->
    <!-- Top Left Tentacle -->
    <path d="M 330 240 C 240 180 180 230 200 320 C 220 380 280 400 310 450" 
          fill="none" stroke="url(#cyanGlow)" stroke-width="14" stroke-linecap="round" filter="url(#neonGlow)"/>
    <circle cx="200" cy="320" r="5" fill="#00F0FF"/>
    
    <!-- Top Right Tentacle -->
    <path d="M 470 240 C 560 180 620 230 600 320 C 580 380 520 400 490 450" 
          fill="none" stroke="url(#goldGlow)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="600" cy="320" r="5" fill="#FFA800"/>

    <!-- Mid Left Tentacle wrapping shield -->
    <path d="M 280 360 C 170 360 150 480 230 550 C 290 600 360 560 360 520" 
          fill="none" stroke="url(#cyanGlow)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="170" cy="460" r="4" fill="#00F0FF"/>

    <!-- Mid Right Tentacle wrapping shield -->
    <path d="M 520 360 C 630 360 650 480 570 550 C 510 600 440 560 440 520" 
          fill="none" stroke="url(#goldGlow)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="630" cy="460" r="4" fill="#FFA800"/>

    <!-- Bottom Left Sweeping Tentacle -->
    <path d="M 320 540 C 260 620 340 680 400 640" 
          fill="none" stroke="url(#cyanGlow)" stroke-width="10" stroke-linecap="round"/>

    <!-- OCTOPUS HEAD (Upper Crown) -->
    <path d="M 400 130 C 350 130 325 180 340 250 C 355 290 380 310 400 320 C 420 310 445 290 460 250 C 475 180 450 130 400 130 Z" 
          fill="url(#shieldCore)" stroke="url(#cyanGlow)" stroke-width="6" />
    
    <!-- Octopus Head Plate Highlights -->
    <path d="M 370 170 C 390 155 410 155 430 170 L 420 220 C 405 215 395 215 380 220 Z" 
          fill="none" stroke="url(#cyanGlow)" stroke-width="3" opacity="0.8"/>

    <!-- Cyber Eyes -->
    <polygon points="360,245 385,255 365,265" fill="#00F0FF" />
    <polygon points="440,245 415,255 435,265" fill="#FFA800" />

    <!-- ESCROW SHIELD EMBLEM -->
    <polygon points="400,280 540,350 540,510 400,600 260,510 260,350" 
             fill="url(#shieldCore)" 
             stroke="url(#cyanGlow)" 
             stroke-width="8" 
             stroke-linejoin="round" />

    <!-- Inner Shield Inset Border -->
    <polygon points="400,305 515,365 515,495 400,570 285,495 285,365" 
             fill="none" 
             stroke="url(#goldGlow)" 
             stroke-width="3" 
             opacity="0.8" />

    <!-- Central Escrow Orbital Ring -->
    <circle cx="400" cy="435" r="75" fill="none" stroke="url(#cyanGlow)" stroke-width="3" stroke-dasharray="8 6" />
    <circle cx="400" cy="435" r="58" fill="rgba(0, 240, 255, 0.04)" stroke="url(#goldGlow)" stroke-width="4" />

    <!-- Central "P" Monogram -->
    <path d="M 380 395 L 415 395 C 435 395 440 405 440 420 C 440 435 435 445 415 445 L 380 445 Z M 380 395 L 380 475" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="9" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
    <circle cx="400" cy="360" r="4" fill="#00F0FF"/>
    <circle cx="400" cy="510" r="4" fill="#FFA800"/>
    <circle cx="325" cy="435" r="4" fill="#00F0FF"/>
    <circle cx="475" cy="435" r="4" fill="#FFA800"/>
  </g>

  <!-- TYPOGRAPHY WORDMARK -->
  <text x="400" y="695" 
        font-family="'Inter', -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif" 
        font-size="52" 
        font-weight="900" 
        letter-spacing="10" 
        text-anchor="middle">
    <tspan fill="url(#cyanGlow)">PACT</tspan><tspan fill="url(#goldGlow)">OPUS</tspan>
  </text>

  <!-- SUBTITLE -->
  <text x="400" y="735" 
        font-family="'Inter', -apple-system, system-ui, 'Segoe UI', monospace" 
        font-size="13" 
        font-weight="600" 
        letter-spacing="5" 
        fill="#8fa0bc" 
        text-anchor="middle">
    MULTI-CHAIN INVOICING NETWORK
  </text>
</svg>
